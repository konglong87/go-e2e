          schema:
            $ref: '#/definitions/internal_server.SwaggerError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server.SwaggerError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_server.SwaggerError'
      security:
      - ApiKeyAuth: []
      summary: Create a local loop
      tags:
      - Runtime
  /runtime/background/{id}:
