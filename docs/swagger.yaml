          schema:
            $ref: '#/definitions/internal_server.SwaggerError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_server.SwaggerError'
      security:
      - ApiKeyAuth: []
      summary: Run a prompt through the local query loop
      tags:
      - Query
  /readyz:
    get:
      description: 就绪探针。不鉴权，逐个探活已配置的依赖（MySQL、配额 Redis、mobile 用量 Redis），任一不可用返回 503。响应只含
        ok/unavailable，不泄漏错误详情。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_server.SwaggerReadinessResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_server.SwaggerReadinessResponse'
      summary: Readiness probe
      tags:
      - System
  /runtime/background:
