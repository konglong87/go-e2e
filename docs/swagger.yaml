        "200":
          description: Prometheus text format
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server.SwaggerError'
      security:
      - ApiKeyAuth: []
      summary: Export Prometheus telemetry metrics
      tags:
      - System
