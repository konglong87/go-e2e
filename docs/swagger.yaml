    get:
      description: Serves the Vite build from GOLANG_CC_WEBUI_DIR, or an auto-discovered
        web/dist next to the working directory or executable. Unknown paths fall back
        to index.html for client-side routing. When no build is present, responds
        503 with a page explaining how to build the frontend.
      parameters:
      - description: Asset path within the build, empty for index.html
        in: path
        name: path
        required: true
        type: string
      - description: Auth token; accepted once and stored in a /webui/-scoped cookie
        in: query
        name: token
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: WebUI asset
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
        "503":
          description: Frontend not built; response body explains how to build it
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Serve the WebUI single-page app
      tags:
      - WebUI
