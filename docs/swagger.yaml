        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server.SwaggerError'
      security:
      - ApiKeyAuth: []
      summary: Validate a local Web Agent workspace path
      tags:
      - Agent Workspaces
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
