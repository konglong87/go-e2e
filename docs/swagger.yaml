  /runtime/settings:
    get:
      description: Returns the raw global settings document with secret values masked.
        `masked` lists the dotted paths whose values were replaced.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_server.GlobalSettingsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server.SwaggerError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_server.SwaggerError'
      security:
      - ApiKeyAuth: []
      summary: Read the global settings.json document
      tags:
      - Runtime
    put:
      consumes:
      - application/json
      description: Accepts a full settings object. Unknown keys are preserved, but
        a type mismatch on a known field is rejected before the file is touched. POST
        behaves identically to PUT.
      parameters:
      - description: Full global settings document
        in: body
        name: request
        required: true
        schema:
          type: object
      - description: Revision from GET (raw or quoted ETag); stale revisions return
          409
        in: header
        name: If-Match
        type: string
      - description: Fallback provider index used to restore promoted credentials
          during save
        in: header
        name: X-Settings-Promoted-Provider-Index
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_server.GlobalSettingsSaveResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_server.SwaggerError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server.SwaggerError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_server.SwaggerError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_server.SwaggerError'
      security:
      - ApiKeyAuth: []
      summary: Replace the global settings.json document
      tags:
      - Runtime
  /runtime/settings/effective:
    get:
      description: File settings use only the global settings.json (GOLANG_CC_CONFIG_DIR
        relocation supported), without workspace or legacy discovery. File sources
        exclude process environment, CLI, profile and run overrides. Startup or status
        callback values do not represent active run configuration.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_server.EffectiveSettingsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server.SwaggerError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_server.SwaggerError'
      security:
      - ApiKeyAuth: []
      summary: Inspect global file settings and safe server startup configuration
      tags:
      - Runtime
  /runtime/settings/environments:
    get:
      parameters:
      - description: Source tenant key
        in: header
        name: X-Tenant-Key
        required: true
        type: string
      - description: Source operator user key
        in: header
        name: X-User-Id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_server.SettingsEnvironmentsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server.SwaggerError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_server.SwaggerError'
      security:
      - BearerAuth: []
      summary: List authorized settings environments and shared global file scope
      tags:
      - Runtime
  /runtime/settings/environments/{environment}/{resource}:
    delete:
      consumes:
      - application/json
      description: Source identity must match the server allowlist and be owner/admin.
        Target tenant/user and database are fixed by server configuration. Resource
        permits tenant/agent-profiles and its existing lifecycle subpaths, tenant/agent-profile-assignment,
