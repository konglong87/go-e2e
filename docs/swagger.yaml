  /mobile/chat/ws:
    get:
      description: Sends connected first. Clients can send subscribe with session_id
        for message_event fanout, subscribe_goal with goal_id for goal_event fanout,
        ping for pong, and cancel with session/message identifiers for active stream
        cancellation. Message and Goal fanout are scoped to the mobile JWT tenant/user.
      produces:
      - application/json
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server.SwaggerError'
      security:
      - MobileJWT: []
      summary: Open mobile chat WebSocket sync, Goal event, and control channel
      tags:
      - Mobile Chat
  /prompt-dump:
    get:
      description: Serves a local WebUI for inspecting prompt dump JSONL records,
        filtering by session_id, and opening full raw request details when the dump
        was captured with GOLANG_CC_DUMP_PROMPT_FULL=true.
      produces:
      - text/html
      responses:
        "200":
          description: HTML prompt dump viewer
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Open the built-in prompt dump viewer WebUI
      tags:
      - Prompt Dump Viewer
  /prompt-dump/api/records:
    get:
      description: Reads the local prompt dump JSONL file from GOLANG_CC_DUMP_PROMPT_JSON
        or /tmp/golang-cc-tui-prompt.jsonl. include_request=true returns full raw
        model requests and may expose sensitive prompt context.
      parameters:
      - description: Filter by TUI session ID
        in: query
        name: session_id
        type: string
      - description: Maximum records to return, capped at 1000
        in: query
        name: limit
        type: integer
      - description: Include full raw request payload
        in: query
        name: include_request
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_server.SwaggerPromptDumpRecordsResponse'
      security:
      - ApiKeyAuth: []
      summary: List prompt dump records
      tags:
      - Prompt Dump Viewer
