  ApiKeyAuth:
    description: Internal server auth token. Use "Bearer <token>".
    in: header
    name: Authorization
    type: apiKey
  MobileJWT:
    description: Mobile chat JWT. Use "Bearer <jwt>".
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
