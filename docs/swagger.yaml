  /tenant/goals/{id}/run:
    post:
      description: Runs one Goal turn through the server query runner by default.
        continuous=true runs a bounded synchronous loop up to max_turns while reusing
        Goal locks, budgets, stop control, audit, and events; detached server background
        execution is intentionally not implied. Defaults to deterministic evaluation;
        evaluator=model enables model-classified evaluation with deterministic fallback
        for ambiguous results. When the Goal has a valid local session_id, the API
        runner creates the same per-turn local transcript checkpoint used by the CLI
        runner before executing each turn.
      parameters:
      - description: Tenant key
        in: header
        name: X-Tenant-Key
        required: true
        type: string
      - description: User key
        in: header
        name: X-User-Id
        required: true
        type: string
      - description: Goal ID
        in: path
        name: id
        required: true
        type: string
      - description: 'Goal evaluator: deterministic or model'
        in: query
        name: evaluator
        type: string
      - description: Run a bounded synchronous loop instead of one turn
        in: query
        name: continuous
        type: boolean
      - description: Maximum turns for continuous=true, default 5, max 20
        in: query
        name: max_turns
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_server.SwaggerRunGoalResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_server.SwaggerError'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_server.SwaggerError'
      security:
      - ApiKeyAuth: []
      summary: Run one tenant goal turn
      tags:
      - Tenant Goals
