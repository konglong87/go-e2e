  - path: internal/server/agent_task_questions.go
    symbols: [AgentTaskQuestionRegistry, OnUserQuestion, tenantAgentTaskQuestionHandler, resolveQuestionAnswer]
  - path: internal/cli/cmd_server.go
    symbols: [applyServerUserQuestionPrompt]
  - path: internal/storage/mysql/session_conversation.go
    symbols: [ListSessionConversationEvents]
  - path: internal/server/handlers_session_control.go
    symbols: [requireSessionControlIdempotencyKey]
  - path: internal/cli/cmd_session_control.go
    symbols: [productionSessionControlRuntime, sessionManagedMonitorCommand]
  - path: internal/cli/cli.go
    symbols: [scheduleRunCommand, runSessionMonitorChild]
  - path: internal/storage/mysql/session_monitor_repository.go
    symbols: [ResolveSessionMonitorByScheduleID, CommitSessionMonitorObservation]
  - path: internal/telemetry/telemetry.go
    symbols: [StartSpan, FinishEvent, EmitCompletedSpan, WithTurnIndex, ValidateRuntimeTraceEvent]
  - path: internal/server/trace.go
    symbols: [buildLocalTraceDetail, localTraceSpans, tenantTraceSpans, finalizeTraceSpans]
  - path: internal/server/trace_analysis.go
    symbols: [analyzeTrace, traceDiagnostics]
  - path: internal/server/runtime_trace_artifact.go
    symbols: [RuntimeTraceArtifact, ExportLocalRuntimeTrace]
  - path: internal/query/continuation_intent.go
    symbols: [resolveContinuationIntent, confirmedSharedStateEffects, continuationTaskContract]
  - path: internal/query/shared_state_gate_retry.go
    symbols: [sharedStateGateRetryTracker]
  - path: internal/query/closure_gate.go
    symbols: [completionGate, preToolClosureGate]
  - path: internal/gitpolicy/gitpolicy.go
    symbols: [Analyze, ParseAuthorization, AuthorizationFromEffects, EffectKey, AnalysisFingerprint, Check]
  - path: internal/toolpolicy/toolpolicy.go
