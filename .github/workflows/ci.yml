name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一 ref 上只保留最新一次运行，避免连续 push 排队占满 runner。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 必须显式 pin：go.mod 的 go 指令只是下界，而 crypto/tls 的
  # GO-2026-5856 需要 1.26.5 才修好。同步 .tool-versions。
  GO_VERSION: '1.26.6'

jobs:
  topology:
    name: runtime topology 最新性
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # PR 影响分析需要 merge-base；浅克隆只能做静态路径检查。
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 校验 registry、代码锚点与图件完整性
        run: go run ./scripts/runtime-topology-check

      - name: 校验 PR 影响声明与图件同步
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: go run ./scripts/runtime-topology-check --base "$BASE_SHA"

  build:
    name: build / vet / gofmt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Tracked frontend/dist/.gitkeep satisfies embed on a fresh checkout.
      # Untagged Wails v2.10.2 uses its non-GUI implementation, so these checks
      # neither need GTK/WebKit nor prove a runnable desktop build.
      - run: go build ./...
      - run: go vet ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt 报告以下文件未格式化"
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod / go.sum 已 tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  swagger:
    name: swagger 已同步
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # docs/swagger.json 曾漂移 19 个 commit（AUDIT-P0-18）：注解漏写不会有任何
    # 报错，只会让生成物静默过期，前端只能手写内联类型兜底。这个 job 重新生成
    # 一遍再 diff，漂移即失败。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # swag 版本必须 pin：不同版本生成的 JSON 会有无害但非空的差异，
      # 浮动版本会让这个检查变成随机失败。
      - run: go mod download
      - run: go install github.com/swaggo/swag/cmd/swag@v1.16.4

      - name: 重新生成 docs/swagger.json
        run: swag init -g cmd/golang-cc/main.go --parseInternal --parseDependency

      - name: swagger 生成物与注解一致
        run: |
          if ! git diff --exit-code -- docs/swagger.json docs/swagger.yaml docs/docs.go; then
            echo "::error::docs/ 下的 swagger 生成物与 internal/server 的注解不一致。"
            echo "::error::本地执行：swag init -g cmd/golang-cc/main.go --parseInternal --parseDependency"
            echo "::error::若是新端点漏了 @Router 注解，补到 internal/server/swagger_annotations.go。"
            exit 1
          fi

      - run: npm ci --legacy-peer-deps
        working-directory: web

      - name: 重新生成 web/src/lib/generated/api-types.ts
        run: npm run generate:api-types
        working-directory: web

      - name: api-types 与 swagger.json 一致
        run: |
          if ! git diff --exit-code -- web/src/lib/generated/api-types.ts; then
            echo "::error::web/src/lib/generated/api-types.ts 与 docs/swagger.json 不一致。"
            echo "::error::本地执行：npm --prefix web run generate:api-types"
            exit 1
          fi

  test:
    name: go test -race
    runs-on: ubuntu-latest
    # 全量 go test 约 8 分钟，-race 约 25 分钟；留足余量但不放任 hang 死。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: go test -race ./... -count=1

  desktop-linux:
    name: Linux desktop native compile (not GUI acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        script: [build-desktop.sh, build-desktop-v2.sh]
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Linux Wails native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
          pkg-config --exists gtk+-3.0 webkit2gtk-4.1

      - run: npm ci --legacy-peer-deps
        working-directory: web
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      # Each matrix entry has a clean checkout. Existing scripts compile the
      # frontend in desktop/desktop-v2 mode before embedding, then build the
      # CGO SQLite sidecar and Wails production binary. Never copy cached web/dist.
      # Ubuntu 24.04 provides WebKit 4.1; the matching Wails tag is required.
      - name: Build real frontend and native desktop
        run: bash "scripts/${{ matrix.script }}" -platform linux/amd64 -tags webkit2_41

  scripts:
    name: scripts/offline-acceptance.sh
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # scripts/ 下 69 个脚本不参与 go build，烂掉了也没人知道（AUDIT-P0-19）。
    # 这个 job 跑不需要 API key 和外部仓库的那部分：静态检查 + 确定性 TUI 场景。
    # 需要真实 key 的脚本按 scripts/README.md 分类，保持 opt-in。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc

      - run: node --test scripts/test-desktop-ci-prerequisites.mjs
      - run: scripts/offline-acceptance.sh

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 独立 job：漏洞库会随时间更新，新 CVE 不应连带遮蔽 build/test 信号。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  web:
    name: web lint / typecheck / build / test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # --legacy-peer-deps 是必需的，不是省事：devDependency 里
      # typescript@6 与 openapi-typescript@7.13 声明的 peer typescript@^5.x
      # 冲突，裸 npm ci 直接 ERESOLVE 失败。等 openapi-typescript 支持
      # TS 6 后可以去掉（见 AUDIT-P0-18 的 api-types 生成链路）。
      - run: npm ci --legacy-peer-deps
        working-directory: web

      # lint 与 typecheck 先跑：它们最快，且失败原因最明确。
      # biome 只做 lint 不做 format —— 现有代码风格与 biome 默认排版有 78 个
      # 文件的差异，格式化会淹没真实改动（见 AUDIT-P2-05）。
      - run: npm run lint
        working-directory: web

      # typecheck 覆盖 tsconfig.app.json（src）之外的部分：vite.config.ts、
      # playwright.config.ts、整个 e2e/。build 里的 tsc 只看 src，这些文件
      # 以前永远不被类型检查。
      - run: npm run typecheck
        working-directory: web

      - run: npm run build
        working-directory: web
      - run: npm run test
        working-directory: web
