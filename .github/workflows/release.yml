name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_tag: ${{ steps.version.outputs.is_tag }}
      signing_mode: ${{ steps.apple.outputs.signing_mode || steps.preview.outputs.signing_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == push && "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME}"
            is_tag=true
          else
            version="preview-${GITHUB_SHA:0:12}"
            is_tag=false
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "is_tag=${is_tag}" >> "$GITHUB_OUTPUT"
      - id: apple
        name: Resolve macOS signing mode
        if: steps.version.outputs.is_tag == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          configured=0
          for value in \
            "$APPLE_CERTIFICATE_P12_BASE64" \
            "$APPLE_CERTIFICATE_PASSWORD" \
            "$APPLE_SIGNING_IDENTITY" \
            "$APPLE_ID" \
            "$APPLE_TEAM_ID" \
            "$APPLE_APP_SPECIFIC_PASSWORD"; do
            [[ -n "$value" ]] && configured=$((configured + 1))
          done

          case "$configured" in
            0)
              signing_mode="unsigned"
              echo "macOS release mode: unsigned/unnotarized"
              ;;
            6)
              signing_mode="signed"
              echo "macOS release mode: Developer ID signed and notarized"
              ;;
            *)
              echo "::error::Configure all six Apple Secrets for signing, or remove all of them for an unsigned release." >&2
              exit 1
              ;;
          esac
          echo "signing_mode=${signing_mode}" >> "$GITHUB_OUTPUT"
      - id: preview
        name: Use unsigned mode for preview
        if: steps.version.outputs.is_tag != 'true'
        run: echo "signing_mode=unsigned" >> "$GITHUB_OUTPUT"

  cli:
    name: CLI archives
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve Go version
        id: go
        shell: bash
        run: |
          version="$(awk '$1 == "golang" { print $2; exit }' .tool-versions)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: true
      - name: Build CLI archives
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: scripts/release.sh
      - name: Verify CLI metadata and licenses
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          stage="go-e2e_${VERSION}_linux_amd64"
          workdir="$(mktemp -d)"
          tar -xzf "dist/${stage}.tar.gz" -C "$workdir"
          test -s "$workdir/$stage/LICENSE"
          test -s "$workdir/$stage/THIRD_PARTY_LICENSES/termenv/LICENSE"
          output="$("$workdir/$stage/go-e2e" --version)"
          case "$output" in
            *"$VERSION"*) ;;
            *) echo "::error::CLI version mismatch: $output"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: release-cli-${{ needs.metadata.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  desktop-linux:
    name: Linux desktop package
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve Go version
        id: go
        shell: bash
        run: |
          version="$(awk '$1 == "golang" { print $2; exit }' .tool-versions)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
          pkg-config --exists gtk+-3.0 webkit2gtk-4.1
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - name: Build and package Linux desktop
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          DIST_DIR: dist
        run: scripts/package-desktop-v2-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ needs.metadata.outputs.version }}
          path: dist/*.tar.gz
          if-no-files-found: error

  desktop-macos:
    name: macOS desktop package (${{ matrix.arch }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve Go version
        id: go
        shell: bash
        run: |
          version="$(awk '$1 == "golang" { print $2; exit }' .tool-versions)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - name: Import Developer ID certificate
        if: needs.metadata.outputs.signing_mode == 'signed'
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CERTIFICATE_BASE64:?Missing APPLE_CERTIFICATE_P12_BASE64}"
          : "${CERTIFICATE_PASSWORD:?Missing APPLE_CERTIFICATE_PASSWORD}"
          keychain="${RUNNER_TEMP}/go-e2e-release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="${RUNNER_TEMP}/developer-id.p12"
          echo "$CERTIFICATE_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          echo "APPLE_KEYCHAIN=${keychain}" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, and package macOS desktop
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          ARCH: ${{ matrix.arch }}
          DIST_DIR: dist
          REQUIRE_NOTARIZATION: ${{ needs.metadata.outputs.signing_mode == 'signed' && '1' || '0' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        shell: bash
        run: scripts/package-desktop-v2-macos.sh
      - name: Clean up signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${APPLE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$APPLE_KEYCHAIN" || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}-${{ needs.metadata.outputs.version }}
          path: dist/*.dmg
          if-no-files-found: error

  desktop-windows:
    name: Windows desktop installer
    needs: metadata
    uses: ./.github/workflows/desktop-windows.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
    secrets: inherit

  publish:
    name: Verify assets and publish GitHub Release
    needs: [metadata, cli, desktop-linux, desktop-macos, desktop-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-dist
          merge-multiple: true
      - name: Generate checksums and release notes
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          TAG: ${{ github.ref_name }}
          MACOS_RELEASE_MODE: ${{ needs.metadata.outputs.signing_mode }}
          OUTPUT: release-dist/RELEASE_NOTES.md
        run: |
          set -euo pipefail
          find release-dist -type f -name 'SHA256SUMS' -delete
          bash scripts/generate-release-notes.sh
          (
            cd release-dist
            sha256sum go-e2e-* go-e2e_* > SHA256SUMS
          )
          bash scripts/verify-release-assets.sh "$VERSION" release-dist
      - name: Upload verified preview bundle
        if: needs.metadata.outputs.is_tag != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verified-preview-${{ needs.metadata.outputs.version }}
          path: release-dist/
          if-no-files-found: error
      - name: Create or update GitHub Release
        if: needs.metadata.outputs.is_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          assets=(release-dist/go-e2e-* release-dist/go-e2e_* release-dist/SHA256SUMS release-dist/RELEASE_NOTES.md)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file release-dist/RELEASE_NOTES.md
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-dist/RELEASE_NOTES.md \
              "${assets[@]}"
          fi

  acceptance-linux:
    name: Post-release acceptance (Linux)
    needs: [metadata, publish]
    if: needs.metadata.outputs.is_tag == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download published Linux archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "go-e2e-desktop_${TAG}_linux_amd64.tar.gz" \
            --pattern "SHA256SUMS" \
            --dir release
      - name: Verify checksum, contents, and version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archive="go-e2e-desktop_${TAG}_linux_amd64.tar.gz"
          grep " ${archive}$" release/SHA256SUMS | (cd release && sha256sum -c -)
          stage="go-e2e-desktop_${TAG}_linux_amd64"
          mkdir -p extracted
          tar -xzf "release/${archive}" -C extracted
          test -x "extracted/${stage}/go-e2e-desktop"
          test -x "extracted/${stage}/go-e2e"
          output="$(extracted/${stage}/go-e2e --version)"
          case "$output" in
            *"$TAG"*) ;;
            *) echo "::error::published Linux version mismatch: $output"; exit 1 ;;
          esac

  acceptance-macos:
    name: Post-release acceptance (macOS ${{ matrix.arch }})
    needs: [metadata, publish]
    if: needs.metadata.outputs.is_tag == 'true' && needs.publish.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Download published macOS DMG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "go-e2e-${TAG}-macos-${{ matrix.arch }}.dmg" \
            --pattern "SHA256SUMS" \
            --dir release
      - name: Mount, install, and verify the published app
        env:
          TAG: ${{ github.ref_name }}
          MACOS_RELEASE_MODE: ${{ needs.metadata.outputs.signing_mode }}
        run: |
          set -euo pipefail
          dmg="release/go-e2e-${TAG}-macos-${{ matrix.arch }}.dmg"
          grep " $(basename "$dmg")$" release/SHA256SUMS | (cd release && shasum -a 256 -c -)
          mountpoint="${RUNNER_TEMP}/go-e2e-dmg"
          install_dir="${RUNNER_TEMP}/Applications"
          mkdir -p "$mountpoint" "$install_dir"
          hdiutil attach -nobrowse -readonly -mountpoint "$mountpoint" "$dmg"
          trap 'hdiutil detach "$mountpoint" >/dev/null || true' EXIT
          ditto "$mountpoint/go-e2e/go-e2e.app" "$install_dir/go-e2e.app"
          codesign --verify --deep --strict --verbose=2 "$install_dir/go-e2e.app"
          if [[ "$MACOS_RELEASE_MODE" == "signed" ]]; then
            spctl --assess --type execute --verbose=4 "$install_dir/go-e2e.app"
          else
            echo "Unsigned/unnotarized macOS release: skipping Gatekeeper assessment."
          fi
          open "$install_dir/go-e2e.app"
          for _ in {1..12}; do
            if pgrep -f "$install_dir/go-e2e.app/Contents/MacOS/go-e2e-desktop" >/dev/null; then
              pkill -f "$install_dir/go-e2e.app/Contents/MacOS/go-e2e-desktop" || true
              exit 0
            fi
            sleep 2
          done
          echo "::error::published macOS app did not launch"
          exit 1

  acceptance-windows:
    name: Post-release acceptance (Windows)
    needs: [metadata, publish]
    if: needs.metadata.outputs.is_tag == 'true' && needs.publish.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download published Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item release -ItemType Directory | Out-Null
          gh release download $env:TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern "go-e2e-setup.exe" `
            --pattern "SHA256SUMS" `
            --dir release
      - name: Install, launch, and uninstall the published installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = (Resolve-Path "release/go-e2e-setup.exe").Path
          $manifestLine = Get-Content "release/SHA256SUMS" | Where-Object { $_ -match "  go-e2e-setup\.exe$" } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($manifestLine) -or $manifestLine -notmatch "^([0-9a-fA-F]{64})  go-e2e-setup\.exe$") {
            throw "Missing go-e2e-setup.exe checksum"
          }
          $expectedHash = $Matches[1]
          $actualHash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "Published Windows installer checksum mismatch"
          }
          $installDir = Join-Path $env:RUNNER_TEMP ("go-e2e release " + [guid]::NewGuid())
          $registryKey = "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\go-e2e"
          $shortcuts = @(
            (Join-Path ([Environment]::GetFolderPath("CommonPrograms")) "go-e2e.lnk"),
            (Join-Path ([Environment]::GetFolderPath("CommonDesktopDirectory")) "go-e2e.lnk")
          )
          New-Item $installDir -ItemType Directory | Out-Null
          $sentinel = Join-Path $installDir "user-data.txt"
          Set-Content $sentinel "preserve me"
          $sentinelHash = (Get-FileHash $sentinel).Hash
          try {
            $process = Start-Process $installer -ArgumentList "/S /D=$installDir" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Install failed: $($process.ExitCode)" }
            foreach ($name in @("go-e2e-desktop.exe", "go-e2e.exe")) {
              if (-not (Test-Path (Join-Path $installDir $name) -PathType Leaf)) {
                throw "Missing installed payload: $name"
              }
            }
            if (-not (Test-Path $registryKey)) { throw "Missing uninstall registration" }
            foreach ($path in $shortcuts) {
              if (-not (Test-Path $path)) { throw "Missing shortcut: $path" }
            }
            $app = Start-Process (Join-Path $installDir "go-e2e-desktop.exe") -PassThru
            Start-Sleep -Seconds 5
            if ($app.HasExited) { throw "Published desktop app exited during launch acceptance" }
            Stop-Process -Id $app.Id -Force
          }
          finally {
            $uninstaller = Join-Path $installDir "uninstall.exe"
            if (Test-Path $uninstaller) {
              $process = Start-Process $uninstaller -ArgumentList "/S _?=$installDir" -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw "Uninstall failed: $($process.ExitCode)" }
              foreach ($name in @("go-e2e-desktop.exe", "go-e2e.exe")) {
                if (Test-Path (Join-Path $installDir $name)) {
                  throw "Published payload survived uninstall: $name"
                }
              }
              foreach ($path in @($registryKey) + $shortcuts) {
                if (Test-Path $path) { throw "Uninstall left registration/shortcut: $path" }
              }
              if ((Get-FileHash $sentinel).Hash -ne $sentinelHash) {
                throw "Uninstall changed user data"
              }
              Remove-Item $uninstaller -ErrorAction SilentlyContinue
            }
            Remove-Item $sentinel -ErrorAction SilentlyContinue
            [System.IO.Directory]::Delete($installDir)
          }
