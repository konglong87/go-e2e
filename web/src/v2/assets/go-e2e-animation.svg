<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 128" role="img" aria-labelledby="go-e2e-animation-title">
  <title id="go-e2e-animation-title">go-e2e</title>
  <style>
    .brand { font: 700 58px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mark, .word, .node { transform-box: fill-box; transform-origin: center; }
    .mark { animation: mark-in 2.8s cubic-bezier(.2,.8,.2,1) infinite; }
    .word { animation: word-in 2.8s cubic-bezier(.2,.8,.2,1) infinite; }
    .node { animation: node-orbit 2.8s ease-in-out infinite; }
    @keyframes mark-in {
      0%, 8% { opacity: 0; transform: translateY(10px) scale(.82) rotate(-8deg); }
      22%, 78% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
      90%, 100% { opacity: 0; transform: translateY(-5px) scale(.96) rotate(3deg); }
    }
    @keyframes word-in {
      0%, 22% { opacity: 0; transform: translateX(-12px); }
      38%, 78% { opacity: 1; transform: translateX(0); }
      90%, 100% { opacity: 0; transform: translateX(8px); }
    }
    @keyframes node-orbit {
      0%, 20% { opacity: 0; transform: translate(0, 0) scale(.6); }
      35% { opacity: 1; transform: translate(0, -7px) scale(1.12); }
      52% { opacity: 1; transform: translate(7px, 2px) scale(1); }
      72% { opacity: .85; transform: translate(0, 7px) scale(.92); }
      90%, 100% { opacity: 0; transform: translate(-4px, 0) scale(.7); }
    }
    @media (prefers-reduced-motion: reduce) {
      .mark, .word, .node { animation: none; opacity: 1; transform: none; }
    }
  </style>
  <g class="mark">
    <rect x="8" y="24" width="80" height="80" rx="24" fill="#1d2733"/>
    <path d="M62 50c-8-6-18-6-27 0-10 8-12 22-4 32 8 10 22 12 32 4l6-6V66H50" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="62" cy="79" r="6" fill="#4aa3df"/>
  </g>
  <text class="brand word" x="108" y="86" fill="#1d2733">go-e2e</text>
  <circle class="node" cx="286" cy="101" r="7" fill="#4aa3df"/>
</svg>
