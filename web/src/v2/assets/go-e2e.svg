<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 64" role="img" aria-labelledby="go-e2e-title">
  <title id="go-e2e-title">go-e2e</title>
  <style>
    .word { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    .mark { transform-box: fill-box; transform-origin: center; animation: mark-pulse 2.8s ease-in-out infinite; }
    .dot { transform-box: fill-box; transform-origin: center; animation: dot-pulse 2.8s ease-in-out infinite; }
    @keyframes mark-pulse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      14% { transform: scale(1.08) rotate(-5deg); }
      28% { transform: scale(1) rotate(0deg); }
    }
    @keyframes dot-pulse {
      0%, 100% { opacity: .55; transform: scale(.8); }
      35%, 65% { opacity: 1; transform: scale(1.15); }
    }
    @media (prefers-reduced-motion: reduce) {
      .mark, .dot { animation: none; }
    }
  </style>
  <g class="mark">
    <rect x="4" y="12" width="40" height="40" rx="12" fill="#1d2733"/>
    <path d="M31 24c-3-3-7-4-11-2-5 2-7 8-5 13 2 5 8 7 13 5l5-3" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="31" cy="36" r="3" fill="#4aa3df"/>
  </g>
  <text class="word" x="52" y="43" fill="#1d2733">go-e2e</text>
  <circle class="dot" cx="146" cy="48" r="4" fill="#4aa3df"/>
</svg>
