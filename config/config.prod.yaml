model: model-id
provider: custom
effort: high

baseURL: https://model.example.com/v1
apiKey: replace-me

fallback:
  enabled: false
  providers: []

update:
  enabled: true
  checkOnStartup: true
  checkOnly: false
  autoPull: true
  skipWhenDirty: true
  strategy: git-ff-only
  repoDir: ""
  customCommand: ""
  versionSourceURL: ""
  scheduleInterval: daily
  timeoutSeconds: 30

multimodal:
  enabled: true
  defaultModel: ""
  models:
    image: ""
    video: ""
    audio: ""
    file: ""

webSearch:
  endpoint: https://cn.bing.com/search

permissions:
  defaultMode: ask
  allow:
    - Read
    - LS
    - Glob
    - Grep
  deny:
    - Bash(git reset:*)
    - Bash(git clean:*)
    - Bash(rm -rf:*)

sandbox:
  enabled: true
  failIfUnavailable: true
  allowUnsandboxedCommands: false
  autoAllowBashIfSandboxed: true
  enabledPlatforms:
    - macos
    - linux
  filesystem:
    allowWrite:
      - .
    denyWrite:
      - .claude/skills
      - .git/hooks
      - .git/config
    denyRead:
      - ~/.ssh

maxToolResultBytes: 200000
additionalDirectories: []
